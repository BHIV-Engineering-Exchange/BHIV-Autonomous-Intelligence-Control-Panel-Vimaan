
name: VIMAAN Production Infrastructure CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vimaan-production
  cancel-in-progress: false

env:
  BACKEND_IMAGE: bhiv/vimaan-backend
  FRONTEND_IMAGE: bhiv/vimaan-frontend
  BACKEND_PORT: "8032"
  FRONTEND_PORT: "8088"

jobs:
  # ==========================================================
  # 1. VALIDATION
  # ==========================================================
  validate:
    name: Validate deployment configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required deployment files
        run: |
          set -e
          test -f backend/Dockerfile
          test -f backend/requirements.txt
          test -f frontend/Dockerfile
          test -f frontend/nginx.conf
          test -f frontend/package-lock.json
          test -f docker-compose.prod.yml
          echo "All required files are present."

      - name: Validate Docker Compose
        run: |
          set -e
          printf '%s\\n' 'VIMAAN_ENV=validation' > .env.production
          printf '%s\\n' 'IMAGE_TAG=validation' > .env.validation
          chmod 600 .env.production .env.validation
          docker compose --env-file .env.validation \
            -f docker-compose.prod.yml config --quiet

      - name: Validate backend Python
        run: |
          python -m compileall -q backend

      - name: Validate backend Docker build
        run: |
          docker build -f backend/Dockerfile \
            -t vimaan-backend:validation .

      - name: Validate frontend Docker build
        run: |
          docker build -f frontend/Dockerfile \
            -t vimaan-frontend:validation frontend

  # ==========================================================
  # 2. BUILD + PUSH
  # ==========================================================
  build:
    name: Build and push production images
    runs-on: ubuntu-latest
    needs: validate

    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short Git SHA
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        run: |
          set -e
          docker buildx build \
            --push \
            --provenance=false \
            --sbom=false \
            --tag "${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}" \
            --tag "${{ env.BACKEND_IMAGE }}:latest" \
            -f backend/Dockerfile .

      - name: Build and push frontend
        run: |
          set -e
          docker buildx build \
            --push \
            --provenance=false \
            --sbom=false \
            --tag "${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}" \
            --tag "${{ env.FRONTEND_IMAGE }}:latest" \
            -f frontend/Dockerfile frontend

      - name: Docker logout
        if: always()
        run: docker logout || true

  # ==========================================================
  # 3. DEPLOY
  # ==========================================================
  deploy:
    name: Deploy to production VM
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Validate deployment secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          VM_IP: ${{ secrets.VM_IP }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
          VIMAAN_ENV_FILE: ${{ secrets.VIMAAN_ENV_FILE }}
        run: |
          set -e
          for name in \
            DOCKER_USERNAME DOCKER_PASSWORD \
            VM_IP VM_PORT VM_USERNAME \
            VM_PASSWORD VM_APP_DIR VIMAAN_ENV_FILE
          do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: Missing secret: $name"
              exit 1
            fi
          done
          echo "All deployment secrets are present."

      - name: Create deployment archive
        env:
          VIMAAN_ENV_FILE: ${{ secrets.VIMAAN_ENV_FILE }}
        run: |
          set -e
          rm -rf deployment deployment.tar.gz
          mkdir -p deployment

          if [ -z "${VIMAAN_ENV_FILE:-}" ]; then
            echo "ERROR: Missing GitHub secret VIMAAN_ENV_FILE"
            exit 1
          fi

          cp docker-compose.prod.yml deployment/
          printf '%s\n' "$VIMAAN_ENV_FILE" > deployment/.env.production
          chmod 600 deployment/.env.production

          test -s deployment/.env.production
          tar -czf deployment.tar.gz -C deployment .
          tar -tzf deployment.tar.gz
          ls -lh deployment.tar.gz

      - name: Create VM application directory
        env:
          VM_IP: ${{ secrets.VM_IP }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
        run: |
          sshpass -p "$VM_PASSWORD" ssh \
            -p "$VM_PORT" \
            -o StrictHostKeyChecking=no \
            "$VM_USERNAME@$VM_IP" \
            "mkdir -p '$VM_APP_DIR/release_history'"

      - name: Copy deployment archive
        env:
          VM_IP: ${{ secrets.VM_IP }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
        run: |
          sshpass -p "$VM_PASSWORD" scp \
            -P "$VM_PORT" \
            -o StrictHostKeyChecking=no \
            deployment.tar.gz \
            "$VM_USERNAME@$VM_IP:$VM_APP_DIR/deployment.tar.gz"

      - name: Deploy application
        env:
          SHORT_SHA: ${{ needs.build.outputs.sha_short }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          VM_IP: ${{ secrets.VM_IP }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
        run: |
          set -e
          PASSWORD_B64="$(printf '%s' "$DOCKER_PASSWORD" | base64 -w 0)"

          sshpass -p "$VM_PASSWORD" ssh \
            -p "$VM_PORT" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "$VM_USERNAME@$VM_IP" \
            "APP_DIR='$VM_APP_DIR' SHORT_SHA='$SHORT_SHA' DOCKER_USERNAME='$DOCKER_USERNAME' PASSWORD_B64='$PASSWORD_B64' BACKEND_IMAGE='${{ env.BACKEND_IMAGE }}' FRONTEND_IMAGE='${{ env.FRONTEND_IMAGE }}' BACKEND_PORT='${{ env.BACKEND_PORT }}' FRONTEND_PORT='${{ env.FRONTEND_PORT }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          mkdir -p release_history

          echo "Deploying VIMAAN release: $SHORT_SHA"

          tar -xzf deployment.tar.gz
          rm -f deployment.tar.gz
          test -s .env.production
          chmod 600 .env.production

          # Preserve the last successful release tag.
          LAST_GOOD_TAG=""
          if [ -s release_history/LAST_GOOD_TAG ]; then
            LAST_GOOD_TAG="$(cat release_history/LAST_GOOD_TAG)"
          fi

          # Check Docker.
          timeout 30s docker info >/dev/null
          docker compose version

          # Docker Hub login.
          printf '%s' "$PASSWORD_B64" | base64 -d | \
            timeout 90s docker login \
              -u "$DOCKER_USERNAME" --password-stdin

          # Pull exact release images.
          for IMAGE in \
            "$BACKEND_IMAGE:$SHORT_SHA" \
            "$FRONTEND_IMAGE:$SHORT_SHA"
          do
            PULLED=0
            for ATTEMPT in 1 2 3 4 5; do
              if timeout 120s docker pull "$IMAGE"; then
                PULLED=1
                break
              fi
              echo "Pull attempt $ATTEMPT failed for $IMAGE"
              sleep 15
            done
            if [ "$PULLED" -ne 1 ]; then
              echo "ERROR: Could not pull $IMAGE"
              exit 1
            fi
          done

          # Select the release image tag.
          printf 'IMAGE_TAG=%s\n' "$SHORT_SHA" > .env.new
          chmod 600 .env.new
          mv .env.new .env

          docker compose --env-file .env \
            -f docker-compose.prod.yml config --quiet

          # Deploy without deleting persistent recordings.
          timeout 600s docker compose --env-file .env \
            -f docker-compose.prod.yml \
            up -d --force-recreate --remove-orphans

          # Backend and frontend health checks.
          HEALTHY=0
          for ATTEMPT in $(seq 1 18); do
            BACKEND_OK=0
            FRONTEND_OK=0

            curl -fsS --max-time 10 \
              "http://127.0.0.1:${BACKEND_PORT}/docs" \
              >/dev/null 2>&1 && BACKEND_OK=1 || true

            curl -fsS --max-time 10 \
              "http://127.0.0.1:${FRONTEND_PORT}/" \
              >/dev/null 2>&1 && FRONTEND_OK=1 || true

            echo "attempt=$ATTEMPT backend=$BACKEND_OK frontend=$FRONTEND_OK"

            if [ "$BACKEND_OK" -eq 1 ] && [ "$FRONTEND_OK" -eq 1 ]; then
              HEALTHY=1
              break
            fi
            sleep 10
          done

          if [ "$HEALTHY" -ne 1 ]; then
            docker compose --env-file .env \
              -f docker-compose.prod.yml ps || true
            docker compose --env-file .env \
              -f docker-compose.prod.yml logs --tail=100 || true
            docker logout || true
            exit 1
          fi

          # --------------------------------------------------
          # Application smoke tests (read-only)
          # --------------------------------------------------
          echo "Running VIMAAN application smoke tests..."

          # 1. Backend OpenAPI must respond and expose core routes.
          curl -fsS --max-time 15 \
            "http://127.0.0.1:${BACKEND_PORT}/openapi.json" \
            -o /tmp/vimaan-openapi.json

          python3 - <<'PYSMOKE'
          import json
          from pathlib import Path

          schema = json.loads(Path('/tmp/vimaan-openapi.json').read_text())
          assert schema.get('openapi'), 'Backend OpenAPI document is missing its version'
          paths = schema.get('paths', {})
          required = {
              '/api/connect',
              '/api/disconnect',
              '/api/command',
              '/api/mission',
          }
          missing = sorted(required - set(paths))
          if missing:
              raise SystemExit(f'Missing expected backend API routes: {missing}')
          if 'post' not in paths['/api/connect']:
              raise SystemExit('Expected POST /api/connect is not registered')
          print(f'Backend OpenAPI smoke test passed ({len(paths)} paths found).')
          PYSMOKE

          # 2. Frontend must return its SPA document and reference a JS bundle.
          curl -fsS --max-time 15 \
            "http://127.0.0.1:${FRONTEND_PORT}/" \
            -o /tmp/vimaan-index.html

          ASSET_PATH="$(grep -oE "src=\"[^\"]+\\.js([?][^\"]*)?\"" /tmp/vimaan-index.html \
            | head -n 1 | cut -d '"' -f2)"

          if [ -z "$ASSET_PATH" ]; then
            echo "ERROR: Frontend HTML does not reference a JavaScript bundle."
            exit 1
          fi

          case "$ASSET_PATH" in
            http://*|https://*) ASSET_URL="$ASSET_PATH" ;;
            /*) ASSET_URL="http://127.0.0.1:${FRONTEND_PORT}${ASSET_PATH}" ;;
            *) ASSET_URL="http://127.0.0.1:${FRONTEND_PORT}/${ASSET_PATH}" ;;
          esac

          curl -fsS --max-time 15 "$ASSET_URL" -o /dev/null
          echo "Frontend HTML and JavaScript bundle smoke tests passed."

          # GET is intentionally used against this POST-only endpoint:
          # HTTP 405 proves Nginx forwarded the request to FastAPI without
          # triggering a drone connection or other state-changing action.
          PROXY_STATUS="$(curl -sS --max-time 15 -o /dev/null \
            -w '%{http_code}' \
            "http://127.0.0.1:${FRONTEND_PORT}/api/connect")"
          if [ "$PROXY_STATUS" != "405" ]; then
            echo "ERROR: Frontend-to-backend API proxy returned HTTP $PROXY_STATUS; expected 405."
            exit 1
          fi
          echo "Frontend-to-backend API proxy smoke test passed (HTTP 405 expected)."

          # 3. Validate Nginx configuration.
          # The API proxy was already verified end-to-end above by checking
          # that GET /api/connect reaches FastAPI and returns HTTP 405.
          # Avoid matching a hard-coded upstream string: Compose service
          # aliases and rendered Nginx formatting can differ.
          docker exec vimaan-frontend nginx -t
          echo "Nginx configuration test passed; API proxy was verified end-to-end."

          # 4. Confirm both application containers are running.
          for CONTAINER in vimaan-backend vimaan-frontend; do
            RUNNING="$(docker inspect --format='{{.State.Running}}' "$CONTAINER")"
            if [ "$RUNNING" != "true" ]; then
              echo "ERROR: $CONTAINER is not running."
              exit 1
            fi
          done

          echo "All VIMAAN smoke tests passed."

          # Update last-good tag only after health checks and smoke tests pass.
          echo "$SHORT_SHA" > release_history/LAST_GOOD_TAG
          cp .env.production release_history/LAST_GOOD_ENV.production
          chmod 600 release_history/LAST_GOOD_ENV.production

          if [ ! -f release_history/RELEASE_HISTORY.md ]; then
            printf '%s\n' \
              '# VIMAAN Release History' \
              '' \
              '| Timestamp | Image Tag | Status | Description |' \
              '|---|---|---|---|' \
              > release_history/RELEASE_HISTORY.md
          fi

          echo "| $(date -u '+%Y-%m-%d %H:%M:%S UTC') | $SHORT_SHA | SUCCESS | Production deployment |" \
            >> release_history/RELEASE_HISTORY.md

          docker logout || true
          echo "VIMAAN deployment successful: $SHORT_SHA"
          REMOTE

      - name: Deployment complete
        env:
          VM_IP: ${{ secrets.VM_IP }}
        run: |
          echo "Frontend: http://${VM_IP}:${{ env.FRONTEND_PORT }}"
          echo "Backend docs: http://${VM_IP}:${{ env.BACKEND_PORT }}/docs"

  # ==========================================================
  # 4. AUTOMATIC ROLLBACK
  # ==========================================================
  rollback:
    name: Automatic rollback
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always() && needs.deploy.result == 'failure'
    timeout-minutes: 30

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Roll back to last known-good release
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          VM_IP: ${{ secrets.VM_IP }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          BACKEND_PORT: ${{ env.BACKEND_PORT }}
          FRONTEND_PORT: ${{ env.FRONTEND_PORT }}
        run: |
          set -e
          PASSWORD_B64="$(printf '%s' "$DOCKER_PASSWORD" | base64 -w 0)"

          sshpass -p "$VM_PASSWORD" ssh \
            -p "$VM_PORT" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "$VM_USERNAME@$VM_IP" \
            "APP_DIR='$VM_APP_DIR' DOCKER_USERNAME='$DOCKER_USERNAME' PASSWORD_B64='$PASSWORD_B64' BACKEND_IMAGE='$BACKEND_IMAGE' FRONTEND_IMAGE='$FRONTEND_IMAGE' BACKEND_PORT='$BACKEND_PORT' FRONTEND_PORT='$FRONTEND_PORT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"

          if [ ! -s release_history/LAST_GOOD_TAG ]; then
            echo "ERROR: No previous successful release exists."
            exit 1
          fi

          LAST_GOOD_TAG="$(cat release_history/LAST_GOOD_TAG)"
          echo "Rolling back to: $LAST_GOOD_TAG"

          if [ ! -s release_history/LAST_GOOD_ENV.production ]; then
            echo "ERROR: Last known-good environment file is missing."
            exit 1
          fi

          cp release_history/LAST_GOOD_ENV.production .env.production
          chmod 600 .env.production

          printf '%s' "$PASSWORD_B64" | base64 -d | \
            timeout 90s docker login \
              -u "$DOCKER_USERNAME" --password-stdin

          docker pull "$BACKEND_IMAGE:$LAST_GOOD_TAG"
          docker pull "$FRONTEND_IMAGE:$LAST_GOOD_TAG"

          printf 'IMAGE_TAG=%s\n' "$LAST_GOOD_TAG" > .env.new
          chmod 600 .env.new
          mv .env.new .env

          docker compose --env-file .env \
            -f docker-compose.prod.yml config --quiet

          timeout 600s docker compose --env-file .env \
            -f docker-compose.prod.yml \
            up -d --force-recreate --remove-orphans

          HEALTHY=0
          for ATTEMPT in $(seq 1 18); do
            BACKEND_OK=0
            FRONTEND_OK=0

            curl -fsS --max-time 10 \
              "http://127.0.0.1:${BACKEND_PORT}/docs" \
              >/dev/null 2>&1 && BACKEND_OK=1 || true

            curl -fsS --max-time 10 \
              "http://127.0.0.1:${FRONTEND_PORT}/" \
              >/dev/null 2>&1 && FRONTEND_OK=1 || true

            echo "rollback_attempt=$ATTEMPT backend=$BACKEND_OK frontend=$FRONTEND_OK"

            if [ "$BACKEND_OK" -eq 1 ] && [ "$FRONTEND_OK" -eq 1 ]; then
              HEALTHY=1
              break
            fi
            sleep 10
          done

          if [ "$HEALTHY" -ne 1 ]; then
            docker compose --env-file .env \
              -f docker-compose.prod.yml ps || true
            docker compose --env-file .env \
              -f docker-compose.prod.yml logs --tail=100 || true
            docker logout || true
            echo "ERROR: Rollback health check failed."
            exit 1
          fi

          if [ ! -f release_history/RELEASE_HISTORY.md ]; then
            printf '%s\n' \
              '# VIMAAN Release History' \
              '' \
              '| Timestamp | Image Tag | Status | Description |' \
              '|---|---|---|---|' \
              > release_history/RELEASE_HISTORY.md
          fi

          echo "| $(date -u '+%Y-%m-%d %H:%M:%S UTC') | $LAST_GOOD_TAG | ROLLBACK_SUCCESS | Automatic rollback |" \
            >> release_history/RELEASE_HISTORY.md

          docker logout || true
          echo "Rollback successful: $LAST_GOOD_TAG"
          REMOTE
