
services:
  backend:
    image: bhiv/vimaan-backend:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: vimaan-backend
    ports:
      - "8032:8000"
    volumes:
      - recordings:/app/backend/recordings
    restart: unless-stopped

  frontend:
    image: bhiv/vimaan-frontend:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: vimaan-frontend
    ports:
      - "8088:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  recordings:
    name: vimaan-recordings
